<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">total-dumb</title>
  <desc id="d">The /dumb agent skill explains what your AI is doing right now and why, in your language. Every answer has the same six slots.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.6" stop-color="#0B0B0B"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="170" cy="70" r="280" fill="url(#glow)"/>

  <!-- left column -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="112" font-size="13" letter-spacing="4.5" fill="#8A8A8A">AGENT SKILL</text>
    <text x="72" y="206" font-size="86" font-weight="bold" fill="#FFFFFF"
          font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace">/dumb</text>
    <text x="72" y="256" font-size="23" fill="#C4C4C4">explains what your AI is doing right now,</text>
    <text x="72" y="288" font-size="23" fill="#C4C4C4">and why it matters, in your language.</text>
    <text x="72" y="342" font-size="15" fill="#6E6E6E">Claude Code  ·  Cursor  ·  Codex  ·  OpenCode</text>
  </g>

  <!-- right card -->
  <g>
    <rect x="612" y="56" width="520" height="288" rx="18" fill="#0E0E0E" stroke="#2E2E2E" stroke-width="1.5"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="648" y="96" font-size="12" letter-spacing="2.6" fill="#6E6E6E">EVERY ANSWER, THE SAME SIX SLOTS</text>

      <circle cx="654" cy="135" r="5.5" fill="#FFFFFF"/>
      <text x="676" y="140" font-size="18" fill="#E6E6E6">What we're doing</text>

      <circle cx="654" cy="171" r="5.5" fill="#FFFFFF"/>
      <text x="676" y="176" font-size="18" fill="#E6E6E6">Why (the bigger picture)</text>

      <circle cx="654" cy="207" r="5.5" fill="#FFFFFF"/>
      <text x="676" y="212" font-size="18" fill="#E6E6E6">Analogy</text>

      <circle cx="654" cy="243" r="5.5" fill="#FFFFFF"/>
      <text x="676" y="248" font-size="18" fill="#E6E6E6">Senior's eye</text>

      <circle cx="654" cy="279" r="5.5" fill="#FFFFFF"/>
      <text x="676" y="284" font-size="18" fill="#E6E6E6">One question</text>

      <circle cx="654" cy="315" r="5.5" fill="#FFFFFF"/>
      <text x="676" y="320" font-size="18" fill="#E6E6E6">Next step</text>
    </g>
  </g>
</svg>
